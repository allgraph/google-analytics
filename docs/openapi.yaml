x-standard-error-statuses:
  '400': Malformed request or unsupported filter/sort field
  '401': Authentication is missing or expired
  '403': Role or assignment does not allow the operation
  '404': Resource does not exist in the caller's visible scope
  '409': Idempotency or current-state conflict
  '422': Validation failed; field_errors contains form field names
  '429': Rate limit exceeded; Retry-After is returned
  '500': Unhandled server error; request_id identifies the log entry
x-mock-scenarios:
  filled:
    description: Use the schema example or generated values with a non-empty data array.
  empty:
    description: Collection endpoints return HTTP 200 with data=[] and pagination from=0/to=0/total=0.
  forbidden:
    description: Return HTTP 403 with error.code=FORBIDDEN.
  failure:
    description: Return HTTP 500 with a request_id that can be shown in the UI.
