  /webhooks/telephony/calls:
    post:
      tags: [Events]
      operationId: ingestTelephonyCall
      summary: Ingest an idempotent signed telephony call event
      description: |
        The sender retries 429 and 5xx responses with exponential backoff and jitter.
        It must not retry 2xx or non-rate-limit 4xx responses. `call_id` is the idempotency key.
      security:
        - webhookSignature: []
      parameters:
        - name: X-Webhook-Timestamp
          in: header
          required: true
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelephonyCallEvent'
