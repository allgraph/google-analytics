openapi: 3.1.0
info:
  title: Callgraph API
  version: 1.0.0-draft
  description: |
    Draft REST contract for the first delivery phase (GA-9).
    All identifiers are strings. Dates and timestamps use ISO 8601 with an explicit timezone.
    List endpoints use `page` and `per_page`; `size` is intentionally not supported.

    Fields forbidden by the current role are omitted from `data` and listed in
    `meta.hidden_fields`. The same restrictions apply to filtering, sorting and exports.
servers:
  - url: http://localhost:8000/api/v1
    description: Development
  - url: /api/v1
    description: Current origin
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: References
  - name: Dashboard
  - name: Calls
  - name: Matching
  - name: Leads
  - name: Analytics
  - name: Finance
  - name: Notifications
  - name: Settings
  - name: Events

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API dependencies
      security:
        - serviceKey: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/Error'
  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Get deployed build version
      security: []
      responses:
        '200':
          description: Build version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get current user, role and effective permissions
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        default:
          $ref: '#/components/responses/Error'

  /references/{dictionary}:
    get:
      tags: [References]
      operationId: listReferenceItems
      summary: Get a filter dictionary
      description: |
        Supported dictionaries: accounts, sites, campaigns, ad-groups, keywords, ads,
        services, cities, districts, operators and masters. Dependent dictionaries are
        filtered by the applicable parent identifiers.
      parameters:
        - name: dictionary
          in: path
          required: true
          schema:
            type: string
            enum: [accounts, sites, campaigns, ad-groups, keywords, ads, services, cities, districts, operators, masters]
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/AdGroupId'
        - name: city_id
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Dictionary values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        default:
          $ref: '#/components/responses/Error'

  /dashboard/overview:
    get:
      tags: [Dashboard]
      operationId: getDashboardOverview
      summary: Get KPI cards, metric strip and funnel
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
      responses:
        '200':
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverviewResponse'
        default:
          $ref: '#/components/responses/Error'
  /dashboard/sites:
    get:
      tags: [Dashboard]
      operationId: getDashboardSites
      summary: Get site performance table
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Site performance page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMetricListResponse'
        default:
          $ref: '#/components/responses/Error'
  /dashboard/alerts:
    get:
      tags: [Dashboard]
      operationId: getDashboardAlerts
      summary: Get recent dashboard alerts
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Alert page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        default:
          $ref: '#/components/responses/Error'
  /dashboard/exports:
    post:
      tags: [Dashboard]
      operationId: createDashboardExport
      summary: Queue a dashboard export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          $ref: '#/components/responses/ExportAccepted'
        default:
          $ref: '#/components/responses/Error'

  /calls:
    get:
      tags: [Calls]
      operationId: listCalls
      summary: Get calls
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/SiteId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CallStatus' }
        - name: operator_id
          in: query
          schema: { type: string }
        - name: confidence
          in: query
          schema: { $ref: '#/components/schemas/ConfidenceCategory' }
        - name: is_repeat
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          schema: { type: string, enum: [started_at, talk_duration_seconds], default: started_at }
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Call page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallListResponse'
        default:
          $ref: '#/components/responses/Error'
  /calls/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Calls]
      operationId: getCall
      summary: Get call details
      responses:
        '200':
          description: Call details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallDetailsResponse'
        default:
          $ref: '#/components/responses/Error'
  /calls/{id}/recording:
    get:
      tags: [Calls]
      operationId: getCallRecording
      summary: Get a short-lived recording URL
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Recording URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResponse'
        default:
          $ref: '#/components/responses/Error'
  /calls/bulk-actions:
    post:
      tags: [Calls]
      operationId: applyCallBulkAction
      summary: Apply an action to selected calls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallBulkActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/BulkActionCompleted'
        default:
          $ref: '#/components/responses/Error'
  /calls/exports:
    post:
      tags: [Calls]
      operationId: createCallsExport
      summary: Queue a role-filtered calls export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          $ref: '#/components/responses/ExportAccepted'
        default:
          $ref: '#/components/responses/Error'

  /matching/review:
    get:
      tags: [Matching]
      operationId: listMatchingReview
      summary: Get calls requiring manual review
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          schema: { type: string, enum: [score, started_at], default: score }
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Review queue page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingListResponse'
        default:
          $ref: '#/components/responses/Error'
  /matching/unattributed:
    get:
      tags: [Matching]
      operationId: listUnattributedCalls
      summary: Get calls without an attributed source
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/SiteId'
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/UnattributedReason' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Unattributed call page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingListResponse'
        default:
          $ref: '#/components/responses/Error'
  /phone-clicks:
    get:
      tags: [Matching]
      operationId: listPhoneClicks
      summary: Get tracked phone-number clicks
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/SiteId'
        - name: linked
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Phone click page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneClickListResponse'
        default:
          $ref: '#/components/responses/Error'
  /calls/{id}/matching-candidates:
    get:
      tags: [Matching]
      operationId: getMatchingCandidates
      summary: Get ranked matching candidates and score explanations
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Matching candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingCandidatesResponse'
        default:
          $ref: '#/components/responses/Error'
  /calls/{id}/matching-decision:
    put:
      tags: [Matching]
      operationId: saveMatchingDecision
      summary: Save an idempotent manual matching decision
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingDecisionRequest'
      responses:
        '200':
          description: Saved matching decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingDecisionResponse'
        default:
          $ref: '#/components/responses/Error'
  /matching/recalculate:
    post:
      tags: [Matching]
      operationId: createMatchingRecalculation
      summary: Queue matching recalculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculationRequest'
      responses:
        '202':
          description: Recalculation accepted or existing active job returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculationResponse'
        default:
          $ref: '#/components/responses/Error'
  /matching/recalculate/{id}:
    get:
      tags: [Matching]
      operationId: getMatchingRecalculation
      summary: Get recalculation status
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Recalculation status and summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculationResponse'
        default:
          $ref: '#/components/responses/Error'

  /leads:
    get:
      tags: [Leads]
      operationId: listLeads
      summary: Get leads
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          schema: { type: string, enum: [number, occurred_at, final_amount], default: occurred_at }
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Lead page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Leads]
      operationId: createLead
      summary: Create a lead, optionally from a call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadWriteRequest'
      responses:
        '201':
          description: Created lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDetailsResponse'
        default:
          $ref: '#/components/responses/Error'
  /leads/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Leads]
      operationId: getLead
      summary: Get lead and status history
      responses:
        '200':
          description: Lead details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDetailsResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Leads]
      operationId: updateLead
      summary: Partially update a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadWriteRequest'
      responses:
        '200':
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDetailsResponse'
        default:
          $ref: '#/components/responses/Error'
  /leads/{id}/status:
    post:
      tags: [Leads]
      operationId: changeLeadStatus
      summary: Change lead status and append history
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadStatusChangeRequest'
      responses:
        '200':
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDetailsResponse'
        default:
          $ref: '#/components/responses/Error'
  /leads/bulk-status:
    post:
      tags: [Leads]
      operationId: bulkChangeLeadStatus
      summary: Change status for selected leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkLeadStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/BulkActionCompleted'
        default:
          $ref: '#/components/responses/Error'
  /leads/bulk-assign-master:
    post:
      tags: [Leads]
      operationId: bulkAssignLeadMaster
      summary: Assign a master to selected leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssignMasterRequest'
      responses:
        '200':
          $ref: '#/components/responses/BulkActionCompleted'
        default:
          $ref: '#/components/responses/Error'
  /leads/status-counts:
    get:
      tags: [Leads]
      operationId: getLeadStatusCounts
      summary: Get lead counters grouped by status
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
      responses:
        '200':
          description: Status counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadStatusCountsResponse'
        default:
          $ref: '#/components/responses/Error'
  /shifts/current:
    get:
      tags: [Leads]
      operationId: getCurrentShift
      summary: Get current operator shift and unresolved lead count
      responses:
        '200':
          description: Current shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        default:
          $ref: '#/components/responses/Error'
  /shifts/{id}/close:
    post:
      tags: [Leads]
      operationId: closeShift
      summary: Close a shift if all mandatory leads are resolved
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Closed shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /analytics/campaign-tree:
    get:
      tags: [Analytics]
      operationId: getCampaignTree
      summary: Lazily load account, campaign, ad-group and keyword metrics
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - name: level
          in: query
          required: true
          schema: { type: string, enum: [account, campaign, ad_group, keyword] }
        - name: parent_id
          in: query
          schema: { type: string }
        - name: loss_only
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: One tree level with totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTreeResponse'
        default:
          $ref: '#/components/responses/Error'
  /analytics/sites:
    get:
      tags: [Analytics]
      operationId: getSiteComparison
      summary: Compare sites and accounts
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Site comparison page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMetricListResponse'
        default:
          $ref: '#/components/responses/Error'
  /analytics/missed-calls:
    get:
      tags: [Analytics]
      operationId: getMissedCallsAnalytics
      summary: Get missed calls and estimated loss
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Missed call page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissedCallListResponse'
        default:
          $ref: '#/components/responses/Error'
  /analytics/exports:
    post:
      tags: [Analytics]
      operationId: createAnalyticsExport
      summary: Queue one of the analytics exports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsExportRequest'
      responses:
        '202':
          $ref: '#/components/responses/ExportAccepted'
        default:
          $ref: '#/components/responses/Error'

  /finance/summary:
    get:
      tags: [Finance]
      operationId: getFinanceSummary
      summary: Get profit and loss summary
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
      responses:
        '200':
          description: P&L summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSummaryResponse'
        default:
          $ref: '#/components/responses/Error'
  /finance/orders:
    get:
      tags: [Finance]
      operationId: listOrderEconomics
      summary: Get order economics
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Order economics page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFinanceListResponse'
        default:
          $ref: '#/components/responses/Error'
  /finance/unattributed:
    get:
      tags: [Finance]
      operationId: listUnattributedOrders
      summary: Get orders with no exact advertising attribution
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Unattributed order page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFinanceListResponse'
        default:
          $ref: '#/components/responses/Error'
  /finance/ad-spend-allocation:
    get:
      tags: [Finance]
      operationId: getAdSpendAllocation
      summary: Get ad spend allocated over five hierarchy levels
      parameters:
        - $ref: '#/components/parameters/ReportFilter'
        - name: level
          in: query
          required: true
          schema: { type: string, enum: [account, site, campaign, ad_group, keyword] }
        - name: parent_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Ad spend allocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSpendAllocationResponse'
        default:
          $ref: '#/components/responses/Error'
  /orders/{id}/financials:
    patch:
      tags: [Finance]
      operationId: updateOrderFinancials
      summary: Update actual order financial values
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFinancialsWriteRequest'
      responses:
        '200':
          description: Updated order economics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFinancialsResponse'
        default:
          $ref: '#/components/responses/Error'

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Get notification occurrences
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [active, processed] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Notification page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        default:
          $ref: '#/components/responses/Error'
  /notifications/{id}:
    patch:
      tags: [Notifications]
      operationId: updateNotification
      summary: Mark a notification as processed or active
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [active, processed] }
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        default:
          $ref: '#/components/responses/Error'
  /notification-rules:
    get:
      tags: [Notifications]
      operationId: listNotificationRules
      summary: Get the seven fixed first-phase rules
      responses:
        '200':
          description: Notification rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRuleListResponse'
        default:
          $ref: '#/components/responses/Error'
  /notification-rules/{id}:
    patch:
      tags: [Notifications]
      operationId: updateNotificationRule
      summary: Enable or update allowed settings of a rule
      description: This operation never modifies advertising accounts or campaigns.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRuleWriteRequest'
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRuleResponse'
        default:
          $ref: '#/components/responses/Error'

  /exports/{id}:
    get:
      tags: [Dashboard, Calls, Analytics]
      operationId: getExport
      summary: Get background export status and download URL
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
