              schema:
                $ref: '#/components/schemas/EventAcceptedResponse'
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptedResponse'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, enum: [10, 50, 100, 500], default: 50 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    Sort:
      name: sort
      in: query
      schema: { type: string }
    Order:
      name: order
      in: query
      description: The UI sends `desc` on the first sortable-column click.
      schema: { type: string, enum: [asc, desc], default: desc }
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date-time }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date-time }
    AccountId:
      name: account_id
      in: query
      schema: { type: string }
    SiteId:
      name: site_id
      in: query
      schema: { type: string }
    CampaignId:
      name: campaign_id
      in: query
      schema: { type: string }
    AdGroupId:
      name: ad_group_id
      in: query
      schema: { type: string }
    ReportFilter:
      name: filters
      in: query
      description: |
        JSON-encoded report filter. Supported keys: date_from, date_to, account_ids,
        site_ids, campaign_ids, ad_group_ids, keyword_ids, search_query_ids, ad_ids,
        devices, countries, city_ids, district_ids, service_ids, operator_ids,
        master_ids, lead_statuses and confidence_categories. All ID/status fields are arrays.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportFilter'
  responses:
    Error:
      description: |
        Error response. Operations can return 400, 401, 403, 404, 409, 422, 429 or 500.
        A 403 response drives the dedicated "no role access" screen state.
      headers:
        X-Request-Id:
          schema: { type: string }
        Retry-After:
          description: Present for 429 and retryable service errors.
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Check the submitted fields
                  field_errors:
                    date_from: [Date from must not be later than date to]
                  request_id: req_01JGA9
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: This role has no access to the requested resource
                  field_errors: {}
                  request_id: req_01JGA9
    Conflict:
      description: The requested state conflicts with current data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: The operation conflicts with current data
              field_errors: {}
              request_id: req_01JGA9
    ExportAccepted:
      description: Export queued
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExportResponse'
    BulkActionCompleted:
      description: Bulk action completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkActionResponse'
  schemas:
    ResponseMeta:
      type: object
      required: [hidden_fields]
      properties:
        hidden_fields:
          type: array
          items: { type: string }
      example: { hidden_fields: [] }
    PaginationMeta:
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          required: [page, per_page, total, from, to]
          properties:
            page: { type: integer, minimum: 1 }
            per_page: { type: integer, enum: [10, 50, 100, 500] }
            total: { type: integer, minimum: 0 }
            from: { type: integer, minimum: 0 }
            to: { type: integer, minimum: 0 }
      example: { page: 1, per_page: 50, total: 1, from: 1, to: 1, hidden_fields: [] }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, field_errors, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            field_errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            request_id: { type: string }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d+\.\d{2}$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
      example: { amount: '12480.00', currency: EUR }
    NullableMetric:
      type: [number, 'null']
      description: Null means the denominator is zero.
    RoleCode:
      type: string
      enum: [owner, manager, marketer, operator, accountant, client, technical_admin]
    AccessLevel:
      type: string
      enum: [full, read, none]
    CallStatus:
      type: string
      enum: [answered, missed]
    ConfidenceCategory:
      type: string
      enum: [high, probable, review, unattributed]
    UnattributedReason:
      type: string
      enum: [over_five_minutes, no_phone_click, multiple_candidates, direct_call]
    LeadStatus:
      type: string
      enum:
        - new_call
        - missed
        - spam
        - unsuitable
        - price_request
        - qualified_lead
        - master_assigned
        - master_departed
        - order_completed
        - payment_received
        - cancelled
        - refund
        - repeat_order
    ReportFilter:
      type: object
      properties:
        date_from: { type: string, format: date-time }
        date_to: { type: string, format: date-time }
        account_ids: { type: array, items: { type: string } }
        site_ids: { type: array, items: { type: string } }
        campaign_ids: { type: array, items: { type: string } }
        ad_group_ids: { type: array, items: { type: string } }
        keyword_ids: { type: array, items: { type: string } }
        search_query_ids: { type: array, items: { type: string } }
        ad_ids: { type: array, items: { type: string } }
        devices: { type: array, items: { type: string } }
        countries: { type: array, items: { type: string } }
        city_ids: { type: array, items: { type: string } }
        district_ids: { type: array, items: { type: string } }
        service_ids: { type: array, items: { type: string } }
        operator_ids: { type: array, items: { type: string } }
        master_ids: { type: array, items: { type: string } }
        lead_statuses: { type: array, items: { $ref: '#/components/schemas/LeadStatus' } }
        confidence_categories: { type: array, items: { $ref: '#/components/schemas/ConfidenceCategory' } }
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status, database, task_queue, last_migration_at, version]
          properties:
            status: { type: string, enum: [ok, degraded, unavailable] }
            database: { type: string, enum: [available, unavailable] }
            task_queue: { type: string, enum: [available, unavailable] }
            last_migration_at: { type: string, format: date-time }
            version: { type: string }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
      example:
        data: { status: ok, database: available, task_queue: available, last_migration_at: '2026-09-08T08:00:00Z', version: 1.0.0 }
        meta: { hidden_fields: [] }
    VersionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [version, environment, built_at]
          properties:
            version: { type: string }
            environment: { type: string, enum: [development, staging, production] }
            built_at: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
      example:
        data: { version: 1.0.0, environment: development, built_at: '2026-09-08T08:00:00Z' }
        meta: { hidden_fields: [] }
    CurrentUserResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [id, name, email, role, account_ids, site_ids, section_access, capabilities]
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
            role: { $ref: '#/components/schemas/RoleCode' }
            account_ids: { type: array, items: { type: string } }
            site_ids: { type: array, items: { type: string } }
            section_access:
              type: object
              additionalProperties: { $ref: '#/components/schemas/AccessLevel' }
            capabilities:
              type: array
              items: { type: string }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
      example:
        data:
          id: usr_1
          name: Anna Owner
          email: anna@example.com
          role: owner
          account_ids: [acc_1]
          site_ids: [site_1]
          section_access: { dashboard: full, calls: full, matching: full, leads: full, analytics: full, districts: none, finance: full, notifications: full, settings: full }
          capabilities: [calls.export, leads.write, finance.write]
        meta: { hidden_fields: [] }
    ReferenceItem:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        parent_id: { type: [string, 'null'] }
    ReferenceListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
      examples:
        - data: [{ id: site_1, label: sanitaer-notdienst-berlin.de, parent_id: acc_1 }]
          meta: { hidden_fields: [] }
        - data: []
          meta: { hidden_fields: [] }
    MetricSet:
      type: object
      properties:
        ad_spend: { $ref: '#/components/schemas/Money' }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        ctr: { $ref: '#/components/schemas/NullableMetric' }
        cpc: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        phone_clicks: { type: integer, minimum: 0 }
        calls: { type: integer, minimum: 0 }
        missed_calls: { type: integer, minimum: 0 }
        matched_calls: { type: integer, minimum: 0 }
        leads: { type: integer, minimum: 0 }
        orders: { type: integer, minimum: 0 }
        revenue: { $ref: '#/components/schemas/Money' }
        expenses: { $ref: '#/components/schemas/Money' }
        profit: { $ref: '#/components/schemas/Money' }
        roi: { $ref: '#/components/schemas/NullableMetric' }
        cpl: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        cpa: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        roas: { $ref: '#/components/schemas/NullableMetric' }
    DashboardOverviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [metrics, funnel]
          properties:
            metrics: { $ref: '#/components/schemas/MetricSet' }
            funnel:
              type: array
              items:
                type: object
                required: [code, label, value]
                properties:
                  code: { type: string }
                  label: { type: string }
                  value: { type: integer, minimum: 0 }
                  conversion: { $ref: '#/components/schemas/NullableMetric' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
      example:
        data:
          metrics: { impressions: 150000, clicks: 7200, phone_clicks: 1800, calls: 1284, leads: 486, orders: 240, roi: 151.8 }
          funnel: [{ code: clicks, label: Clicks, value: 7200, conversion: 100 }, { code: calls, label: Calls, value: 1284, conversion: 17.83 }]
        meta: { hidden_fields: [] }
    SiteMetric:
      type: object
      required: [site_id, site_name, metrics]
      properties:
        site_id: { type: string }
        site_name: { type: string }
        account_id: { type: string }
        metrics: { $ref: '#/components/schemas/MetricSet' }
    SiteMetricListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SiteMetric' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
