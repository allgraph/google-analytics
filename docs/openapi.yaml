        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneClickEvent'
      responses:
        '200':
          description: Existing event returned for the same phone_click_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptedResponse'
        '201':
